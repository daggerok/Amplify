name: Update Amplify ETF data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate api/data.json
        run: bun ./scripts/update-data.js

      - name: Commit updated data
        run: |
          if git diff --quiet -- api/data.json; then
            echo "api/data.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/data.json
          git commit -m "Update Amplify ETF data"
          git push
