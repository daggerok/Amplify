<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Amplify ETF holdings to watchlist from a static api/data.json feed." />
  <title>Amplify ETF Holdings to Watchlist</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Inter font (same as iShares app) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN, no build step for local Parcel/Bun workflow) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>

  <!-- Babel standalone: compile inline TypeScript in this single index.html, same no-build style as daggerok/youtube -->
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Synchronous theme init (prevents flash, same strategy as iShares) -->
  <script>
    (function () {
      var dark = localStorage.getItem('amplify-theme') === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc';
    })();
  </script>

  <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade-in{animation:fadeIn .3s ease-out}

    /* Themed scrollbars (same slate palette as iShares) */
    .themed-scroll::-webkit-scrollbar{width:10px;height:10px}
    .themed-scroll::-webkit-scrollbar-track{background:transparent}
    .themed-scroll::-webkit-scrollbar-thumb{background-color:#cbd5e1;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
    .themed-scroll::-webkit-scrollbar-thumb:hover{background-color:#94a3b8}
    .dark .themed-scroll::-webkit-scrollbar-thumb{background-color:#334155}
    .dark .themed-scroll::-webkit-scrollbar-thumb:hover{background-color:#475569}
    .themed-scroll::-webkit-scrollbar-corner{background:transparent}
    .themed-scroll{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
    .dark .themed-scroll{scrollbar-color:#334155 transparent}

    .selected-row{background:#eff6ff}
    .dark .selected-row{background:rgba(30,64,175,.22)}

    /* Detail navigation expands into place after an ETF is selected. */
    main.space-y-6 > #selected-tabs-panel{max-height:0;margin-top:0;overflow:hidden;opacity:0;transform:translateY(-10px);padding-top:0;padding-bottom:0;border-color:transparent;transition:max-height .32s ease,margin-top .32s ease,padding .32s ease,opacity .22s ease,transform .32s ease,border-color .22s ease}
    main.space-y-6 > #selected-tabs-panel.is-visible{max-height:8rem;margin-top:1.5rem;padding-top:1rem;padding-bottom:1rem;opacity:1;transform:translateY(0);border-color:rgb(226 232 240)}
    .dark main.space-y-6 > #selected-tabs-panel.is-visible{border-color:rgb(51 65 85)}

    @keyframes tableRefresh{from{opacity:.32;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    #table-body.table-content-enter{animation:tableRefresh .22s ease-out}
    @media (prefers-reduced-motion:reduce){#table-body.table-content-enter{animation:none}main.space-y-6 > #selected-tabs-panel{transition:none}}
  </style>
</head>
<body class="min-h-screen font-sans bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div class="min-h-screen flex flex-col animate-fade-in">

    <!-- Header: intentionally mirrors daggerok/iShares look and feel -->
    <header class="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-3 flex flex-wrap justify-between items-center gap-3 z-40 shadow-xs shrink-0">
      <div class="flex flex-1 flex-wrap items-center gap-x-3 gap-y-1.5 min-w-0">
        <div class="flex items-start gap-3 min-w-0">
          <svg class="w-6 h-6 text-blue-600 dark:text-blue-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 7l-8.5 8.5-5-5L2 17" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7h6v6" />
          </svg>
          <h1 class="min-w-0 text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">Amplify ETF Holdings to Watchlist</h1>
        </div>
        <span id="app-subtitle" class="basis-full sm:basis-auto text-sm text-slate-500 dark:text-slate-400">
          Search Amplify ETFs, select rows, then use the Watchlist tab. Data comes from
          <a href="./api/data.json" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">api/data.json</a>
          generated from
          <a href="https://amplifyetfs.com/our-etfs/" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">Amplify ETFs</a>
        </span>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <span id="ticker-count" class="bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 text-sm font-semibold px-3.5 py-1.5 rounded-full border border-blue-200 dark:border-blue-500/30">
          Loading…
        </span>
        <button id="theme-toggle" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-base leading-none" title="Toggle Theme">🌙</button>
      </div>
    </header>

    <main class="flex-1 w-full max-w-full p-4 sm:p-8 space-y-6">

      <!-- Search, Tabs & Action Bar: same simple pattern as iShares -->
      <div class="flex flex-col lg:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-800/80 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm backdrop-blur">

        <!-- One full-text search input. It filters ETFs or selected watchlist rows case-insensitively. -->
        <input
          type="text"
          id="search-input"
          placeholder="Search ETFs, fund names, holdings, tickers, CUSIPs..."
          disabled
          class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2 w-full lg:w-96 focus:outline-none focus:border-blue-500 text-sm placeholder-slate-400 dark:placeholder-slate-500 disabled:opacity-50 disabled:cursor-not-allowed shrink-0 transition"
        />

        <!-- ETF catalogue tabs stay with search and actions, as in the original layout. -->
        <div id="tabs-bar" class="hidden flex flex-wrap items-center justify-center gap-1.5 overflow-x-auto py-1 w-full max-w-full flex-1 themed-scroll"></div>

        <!-- Actions intentionally match iShares naming and placement -->
        <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-end shrink-0">
          <button id="copy-btn" disabled class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-200 dark:hover:bg-slate-700 disabled:hover:bg-slate-100 dark:disabled:hover:bg-slate-800">Copy Tickers</button>
          <button id="export-csv-btn" disabled class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Export .csv</button>
          <button id="export-txt-btn" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-emerald-600">Export .txt</button>
          <button id="reset-btn" disabled class="bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-700/50 px-3 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-rose-200 dark:hover:bg-rose-800/60 disabled:hover:bg-rose-100 dark:disabled:hover:bg-rose-900/40">Clear</button>
        </div>

      </div>


      <!-- Selected ETF detail tabs appear immediately above the table. -->
      <nav id="selected-tabs-panel" class="bg-white dark:bg-slate-800/80 px-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm backdrop-blur" aria-label="Selected ETF detail views">
        <div id="selected-tabs-bar" class="flex flex-wrap items-center justify-center gap-1.5 overflow-x-auto py-1 w-full max-w-full themed-scroll"></div>
      </nav>

      <!-- Data Table Container -->
      <div class="bg-white dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm backdrop-blur overflow-hidden">
        <div class="max-h-[calc(100vh-245px)] overflow-x-auto overflow-y-auto themed-scroll">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead id="table-head" class="bg-slate-50 dark:bg-slate-900/95 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20 backdrop-blur">
              <tr>
                <th class="py-3.5 px-4 w-12 text-center" title="Row index in the current table view.">#</th>
                <th class="py-3.5 px-4" title="Ticker Symbol — Unique exchange identifier for the Amplify ETF.">ETF</th>
                <th class="py-3.5 px-4" title="Fund Name — Official legal name of the Amplify Exchange-Traded Fund (ETF).">Fund Name</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
              <tr>
                <td colspan="10" class="py-12 text-center text-slate-400 dark:text-slate-500">Loading Amplify ETF data from api/data.json…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>

  </div>

  <script type="text/babel" data-presets="typescript">
type CategoryId = string;
type FundDetailTab = 'overview' | 'holdings' | 'performance' | 'distributions' | 'yields' | 'allocations' | 'price';
type ActiveTab = string;
type SortDirection = 'asc' | 'desc';
type TableRow = Record<string, unknown> & { searchIndex?: string };

type Fund = {
  ticker: string;
  name: string;
  category: string;
  nav?: string;
  navValue?: number | null;
  netAssets?: string;
  netAssetsValue?: number | null;
  expenseRatio?: string;
  holdingsAsOfDate?: string;
  holdingsCount?: number;
  rank?: number;
  distributionYield?: string;
  distributionYieldValue?: number | null;
  secYield?: string;
  secYieldValue?: number | null;
  ytdReturn?: number | null;
  tr1y?: number | null;
  cagr3y?: number | null;
  cagr5y?: number | null;
  cagr10y?: number | null;
  siAnn?: number | null;
  tr3y?: number | null;
  tr5y?: number | null;
  tr10y?: number | null;
  returnAsOf?: string;
  inceptionDate?: string;
  historyCount?: number | null;
};

type Holding = {
  id?: string;
  fundTicker: string;
  fundName: string;
  asOfDate?: string;
  symbol: string;
  rawSymbol?: string;
  name: string;
  cusip?: string;
  weight?: number | null;
  marketValue?: number | null;
  shares?: number | null;
  price?: number | null;
  flags?: string[];
};

type FundHoldings = {
  ticker: string;
  fundName: string;
  asOfDate?: string;
  source?: string;
  positions: Holding[];
  error?: string;
};

type FundDetail = {
  ticker: string;
  fundName: string;
  category: string;
  metadata?: Record<string, unknown>;
  daily?: Record<string, unknown> | null;
  yields?: Record<string, unknown> | null;
  distributions?: DistributionRow[];
  performance?: {
    monthly?: PerformanceDoc | null;
    quarterly?: PerformanceDoc | null;
  };
  allocations?: AllocationDoc | null;
};

type DistributionRow = {
  id?: string;
  exDate?: string;
  recordDate?: string;
  payableDate?: string;
  amount?: string | number;
  currency?: string;
  type?: string;
  note?: string | null;
  year?: number | null;
};

type PerformanceDoc = {
  asOfDate?: string;
  source?: string;
  returns?: Array<{
    ticker?: string;
    label?: string;
    type?: string;
    returns?: Record<string, number | string | null>;
  }>;
};

type AllocationDoc = {
  asOfDate?: string;
  allocations?: Array<{
    dimensionID?: number | null;
    dimensionName?: string;
    dimvalues?: Array<{ label?: string; weight?: number | null; holdingCount?: number | null }>;
  }>;
};

type DataApi = {
  generatedAt?: string;
  counts?: { funds?: number; holdings?: number; distributions?: number };
  funds: Fund[];
  holdings: Record<string, FundHoldings>;
  details?: Record<string, FundDetail>;
};

type FundRow = Fund & { searchIndex: string };

type WatchlistRow = {
  symbol: string;
  name: string;
  names: string[];
  cusips: string[];
  flags: string[];
  fundTickers: string[];
  fundCount: number;
  weightSum: number;
  maxWeight: number | null;
  marketValueSum: number;
  searchIndex: string;
};

type AppState = {
  data: DataApi | null;
  funds: FundRow[];
  holdings: Record<string, FundHoldings>;
  details: Record<string, FundDetail>;
  selected: Set<string>;
  activeFundTicker: string | null;
  activeTab: ActiveTab;
  searches: Record<string, string>;
  sortKey: string;
  sortDir: SortDirection;
};

const DATA_API_URL = './api/data.json';
const THEME_KEY = 'amplify-theme';

// Hover explanations for table headers. Native `title` tooltips, same pattern as daggerok/iShares.
const COLUMN_TOOLTIPS = {
  '#': 'Row index in the current table view.',
  'Use': 'Use / Multi-ETF Selection — Check this box to include this ETF\'s underlying holdings in the combined Watchlist tab.',
  'Ticker': 'Ticker Symbol — Unique exchange identifier for the Amplify ETF or underlying holding.',
  'Fund Name': 'Fund Name — Official legal name of the Amplify Exchange-Traded Fund (ETF).',
  'Name': 'Security Name — Full registered legal name of the company or underlying financial asset.',
  'Type': 'Fund Type — Amplify product category: Income, Growth (Thematic), or Core.',
  'NAV': 'NAV (Net Asset Value) — Per-share dollar value of the fund: (total assets − liabilities) ÷ shares outstanding.',
  'Net Assets': 'Net Assets (AUM) — Assets Under Management: total market value of fund assets minus liabilities. AUM = Assets Under Management.',
  'Expense': 'Expense Ratio — Annual management fee and operating expenses charged to shareholders, as a percent of fund assets.',
  'Dividend Yield': 'Dividend Yield / Distribution Rate — Trailing distribution yield: recent cash distributions annualized, divided by current NAV. Amplify publishes this as Distribution Yield.',
  'SEC Yield': '30-Day SEC Yield — Standardized yield required by the U.S. SEC, based on income earned over the last 30 days after expenses. Useful for comparing income funds.',
  'YTD Return': 'YTD Return (Year-To-Date Total Return) — Cumulative NAV total return from January 1 of the current calendar year through the latest month-end, including reinvested distributions.',
  'YTD': 'YTD (Year-To-Date) — Cumulative total return from the start of the current calendar year.',
  'TR 1Y': 'TR 1Y (1-Year Total Return) — NAV total return over the past 1 year (TR = Total Return), including price change and reinvested distributions. For a 1-year window this equals the annualized 1-year figure Amplify publishes.',
  'TR 3Y': 'TR 3Y (3-Year Total Return) — Cumulative NAV total return over 3 years (TR = Total Return). Derived from Amplify\'s published 3-year annualized return: (1 + CAGR)^3 − 1.',
  'TR 5Y': 'TR 5Y (5-Year Total Return) — Cumulative NAV total return over 5 years (TR = Total Return). Derived from Amplify\'s published 5-year annualized return: (1 + CAGR)^5 − 1.',
  'TR 10Y': 'TR 10Y (10-Year Total Return) — Cumulative NAV total return over 10 years (TR = Total Return). Derived from Amplify\'s published 10-year annualized return: (1 + CAGR)^10 − 1.',
  'CAGR 3Y': 'CAGR 3Y (3-Year Compound Annual Growth Rate) — Annualized NAV total return over 3 years (CAGR = Compound Annual Growth Rate). Amplify publishes 3YR as an annualized figure, not a 3-year cumulative total.',
  'CAGR 5Y': 'CAGR 5Y (5-Year Compound Annual Growth Rate) — Annualized NAV total return over 5 years (CAGR = Compound Annual Growth Rate). Amplify publishes 5YR as an annualized figure.',
  'CAGR 10Y': 'CAGR 10Y (10-Year Compound Annual Growth Rate) — Annualized NAV total return over 10 years (CAGR = Compound Annual Growth Rate). Amplify publishes 10YR as an annualized figure.',
  'SI Ann.': 'SI Ann. (Since Inception Annualized) — Compound annual growth rate from the fund\'s inception date through the latest month-end. SI = Since Inception.',
  'SI Cum.': 'SI Cum. (Since Inception Cumulative) — Total cumulative NAV return from inception through the latest month-end, including reinvested distributions. SI = Since Inception.',
  'Return As Of': 'Return As Of Date — Month-end cutoff for the published YTD, TR, CAGR, and since-inception performance figures.',
  'Inception': 'Inception Date — Official date the ETF began operations / first traded.',
  'Inception Date': 'Inception Date — Official date the ETF began operations / first traded.',

  'Weight': 'Portfolio Weight (%) — Percentage of the fund\'s net assets allocated to this position.',
  'Shares': 'Shares / Quantity — Number of shares or units of the security held by the fund.',

  'ISIN': 'ISIN — International Securities Identification Number, a 12-character unique identifier.',

  'Metric': 'Metric — Name of the reported data point.',
  'Value': 'Value — Reported figure for this metric.',

  '1M': '1M (1-Month Total Return) — Cumulative NAV return over the most recent calendar month.',
  '3M': '3M (3-Month Total Return) — Cumulative NAV return over the most recent 3 months.',
  '6M': '6M (6-Month Total Return) — Cumulative NAV return over the most recent 6 months.',
  '1Y': '1Y (1-Year Total Return) — NAV total return over the past 1 year, including reinvested distributions.',
  '3Y': '3Y (3-Year CAGR) — Annualized NAV total return over 3 years. CAGR = Compound Annual Growth Rate.',
  '5Y': '5Y (5-Year CAGR) — Annualized NAV total return over 5 years. CAGR = Compound Annual Growth Rate.',
  '10Y': '10Y (10-Year CAGR) — Annualized NAV total return over 10 years. CAGR = Compound Annual Growth Rate.',
  'Allocation': 'Allocation Dimension — How holdings are grouped (GICS sector, country, market cap, theme).',
  'Ex-Date': 'Ex-Dividend Date — On or after this date, a buyer of the ETF is not entitled to the next distribution.',
  'Record Date': 'Record Date — Date the fund locks the shareholder list eligible for the distribution.',
  'Payable Date': 'Payable Date — Date cash is paid to shareholders of record.',
  'Amount': 'Distribution Amount ($) — Cash paid per share, in USD.',
  'Year': 'Distribution Year — Calendar year of the distribution.',
  'Note': 'Note — Extra comment on the distribution, if Amplify provided one.',
  'Price': 'Price ($) — Market price per share of the holding, when available.',
};

const SELECTED_KEY = 'amplify-selected-etfs';
const ACTIVE_FUND_KEY = 'amplify-active-fund';
const DEFAULT_SELECTED_TICKERS = ['HACK', 'SILJ'];
const SEARCHES_KEY = 'amplify-searches';

const DETAIL_TABS: Array<{ key: FundDetailTab; label: string }> = [
  { key: 'overview', label: 'Overview' },
  { key: 'holdings', label: 'Holdings' },
  { key: 'performance', label: 'Performance' },
  { key: 'allocations', label: 'Allocations' },
  { key: 'distributions', label: 'Distributions' },
  { key: 'yields', label: 'Yields' },
  { key: 'price', label: 'Price' },
];

const state: AppState = {
  data: null,
  funds: [],
  holdings: {},
  details: {},
  selected: new Set(),
  activeFundTicker: null,
  activeTab: 'All',
  searches: {},
  sortKey: 'rank',
  sortDir: 'asc',
};

const el = {
  themeToggle: byId('theme-toggle'),
  tickerCount: byId('ticker-count'),
  subtitle: byId('app-subtitle'),
  searchInput: byId('search-input'),
  tabsBar: byId('tabs-bar'),
  selectedTabsPanel: byId('selected-tabs-panel'),
  selectedTabsBar: byId('selected-tabs-bar'),
  copyBtn: byId('copy-btn'),
  exportCsvBtn: byId('export-csv-btn'),
  exportTxtBtn: byId('export-txt-btn'),
  resetBtn: byId('reset-btn'),
  tableHead: byId('table-head'),
  tableBody: byId('table-body'),
};

init();

function getHeaderTooltip(header: string): string {
  if (!header) return '';
  if (COLUMN_TOOLTIPS[header]) return COLUMN_TOOLTIPS[header];
  const clean = String(header).trim();
  const keys = Object.keys(COLUMN_TOOLTIPS);
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    if (key.toLowerCase() === clean.toLowerCase()) return COLUMN_TOOLTIPS[key];
  }
  if (/^TR\s+\d+/i.test(clean)) return `${clean} = Total Return: cumulative return over the period, including price change and reinvested distributions.`;
  if (/^CAGR\s+\d+/i.test(clean)) return `${clean} = Compound Annual Growth Rate: annualized geometric mean return over the period.`;
  if (/weight/i.test(clean)) return `${clean}: Portfolio weight percentage allocation.`;
  if (/yield/i.test(clean)) return `${clean}: Annualized payout or dividend yield.`;
  if (/return/i.test(clean)) return `${clean}: Performance total return metric.`;
  return `${clean} — column in the current table.`;
}

function indexHeader(): string {
  return `<th class="py-3.5 px-4 w-12 text-center" title="${escapeHtml(getHeaderTooltip('#'))}">#</th>`;
}

function useHeader(): string {
  const allSelected = state.funds.length > 0 && state.selected.size === state.funds.length;
  return `<th class="py-3.5 px-4 w-20 text-center" title="${escapeHtml(getHeaderTooltip('Use'))}">
    <div class="inline-flex items-center justify-center gap-1">
      <input type="checkbox" id="select-all-checkbox" ${allSelected ? 'checked' : ''} class="w-4 h-4 accent-blue-600 cursor-pointer" title="Select / Deselect all ETFs" />
      <span>Use</span>
    </div>
  </th>`;
}

function init(): void {
  restoreSelectedEtfs();
  restoreSearches();
  applyTheme(localStorage.getItem(THEME_KEY) === 'dark');
  bindEvents();
  void loadData();
}

function bindEvents(): void {
  el.themeToggle.addEventListener('click', () => {
    const dark = !document.documentElement.classList.contains('dark');
    localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
    applyTheme(dark);
  });

  el.searchInput.addEventListener('input', () => {
    setCurrentQuery(el.searchInput.value.trim());
    render();
  });

  el.copyBtn.addEventListener('click', copyTickers);
  el.exportCsvBtn.addEventListener('click', exportCsv);
  el.exportTxtBtn.addEventListener('click', exportTxt);
  el.resetBtn.addEventListener('click', clearSelectionAndSearch);
}

async function loadData(): Promise<void> {
  try {
    setStatus('Loading Amplify ETF data from api/data.json…', 'info');
    const response = await fetch(DATA_API_URL, { headers: { Accept: 'application/json' }, cache: 'no-cache' });
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);

    const data: DataApi = await response.json();
    const holdings = data.holdings || {};

    state.data = data;
    state.holdings = holdings;
    state.details = data.details || {};
    state.funds = (data.funds || [])
      .map((fund, index) => normalizeFundRow(fund, holdings, data.details || {}, index))
      .sort((a, b) => (a.rank ?? 9999) - (b.rank ?? 9999) || a.ticker.localeCompare(b.ticker));

    if (state.activeFundTicker && !state.funds.some(fund => fund.ticker === state.activeFundTicker)) {
      state.activeFundTicker = [...state.selected][0] || null;
    }

    el.searchInput.disabled = false;
    ensureValidTab();
    render();
  } catch (error) {
    const message = error instanceof Error ? error.message : String(error);
    el.tickerCount.textContent = 'Error';
    setStatus(`Unable to load api/data.json: ${message}. Run bun ./scripts/update-data.ts and serve with bunx parcel ./index.html.`, 'error');
    el.tableBody.innerHTML = `<tr><td colspan="10" class="py-12 text-center text-rose-500 dark:text-rose-300">Unable to load api/data.json</td></tr>`;
  }
}

function normalizeFundRow(fund: Fund, holdings: Record<string, FundHoldings>, details: Record<string, FundDetail>, index: number): FundRow {
  const ticker = sanitizeTicker(fund.ticker);
  const positions = holdings[ticker]?.positions || [];
  const detail = details[ticker];
  const catalogMetrics = getCatalogMetrics(detail);
  const holdingsText = positions
    .map(position => [position.symbol, position.name, position.cusip, position.flags?.join(' ')].filter(Boolean).join(' '))
    .join(' ');

  return {
    ...fund,
    ticker,
    name: fund.name || ticker,
    category: normalizeCategory(fund.category),
    holdingsCount: numberOrNull(fund.holdingsCount) ?? positions.length,
    rank: numberOrNull(fund.rank) ?? index + 1,
    distributionYield: catalogMetrics.distributionYield,
    distributionYieldValue: catalogMetrics.distributionYieldValue,
    secYield: catalogMetrics.secYield,
    secYieldValue: catalogMetrics.secYieldValue,
    ytdReturn: catalogMetrics.ytdReturn,
    tr1y: catalogMetrics.tr1y,
    cagr3y: catalogMetrics.cagr3y,
    cagr5y: catalogMetrics.cagr5y,
    cagr10y: catalogMetrics.cagr10y,
    siAnn: catalogMetrics.siAnn,
    tr3y: catalogMetrics.tr3y,
    tr5y: catalogMetrics.tr5y,
    tr10y: catalogMetrics.tr10y,
    returnAsOf: catalogMetrics.returnAsOf,
    inceptionDate: catalogMetrics.inceptionDate,
    historyCount: numberOrNull(fund.historyCount),
    searchIndex: normalizeSearchText([
      ticker,
      fund.name,
      normalizeCategory(fund.category),
      categoryLabel(normalizeCategory(fund.category)),
      fund.nav,
      fund.netAssets,
      fund.expenseRatio,
      catalogMetrics.distributionYield,
      catalogMetrics.secYield,
      catalogMetrics.inceptionDate,
      catalogMetrics.returnAsOf,
      fund.historyCount,
      fund.holdingsAsOfDate,
      holdingsText,
    ].join(' ')),
  };
}

function getCatalogMetrics(detail) {
  const yields = (detail && detail.yields) || {};
  const meta = (detail && detail.metadata) || {};
  const monthly = detail && detail.performance ? detail.performance.monthly : null;
  const navRows = (monthly && monthly.returns) || [];
  let navRow = null;
  for (let i = 0; i < navRows.length; i++) {
    if (String(navRows[i].type || '').toUpperCase() === 'NAV') {
      navRow = navRows[i];
      break;
    }
  }
  const returns = (navRow && navRow.returns) || {};
  return {
    distributionYield: formatYieldDisplay(yields.Distribution_Yield),
    distributionYieldValue: numberOrNull(yields.Distribution_Yield),
    secYield: formatYieldDisplay(yields['30_Day_SECYield']),
    secYieldValue: numberOrNull(yields['30_Day_SECYield']),
    ytdReturn: numberOrNull(returns.YTD),
    tr1y: numberOrNull(returns['1Y']),
    cagr3y: numberOrNull(returns['3Y']),
    cagr5y: numberOrNull(returns['5Y']),
    cagr10y: numberOrNull(returns['10Y']),
    siAnn: numberOrNull(returns.SI_Ann),
    tr3y: cumulativeFromCagr(numberOrNull(returns['3Y']), 3),
    tr5y: cumulativeFromCagr(numberOrNull(returns['5Y']), 5),
    tr10y: cumulativeFromCagr(numberOrNull(returns['10Y']), 10),
    returnAsOf: String((monthly && monthly.asOfDate) || ''),
    inceptionDate: String(meta.InceptionDate || meta.LaunchDate || ''),
  };
}

function cumulativeFromCagr(annualized, years) {
  if (annualized === null || annualized === undefined) return null;
  return (Math.pow(1 + annualized / 100, years) - 1) * 100;
}

function formatYieldDisplay(value) {
  if (value === null || value === undefined || value === '') return '—';
  const text = String(value).trim();
  if (text === '-' || text === '—') return '—';
  if (text.includes('%')) return text;
  const parsed = numberOrNull(text);
  return parsed === null ? text : parsed.toFixed(2) + '%';
}

function render(): void {
  if (!state.data) return;
  ensureValidTab();
  syncSearchInput();
  renderTabs();

  if (state.activeTab === 'watchlist') renderWatchlistTable();
  else if (isDetailTab(state.activeTab)) renderDetailTable(detailTabKey(state.activeTab));
  else renderFundsTable();

  renderControls();
  animateTableUpdate();
}

function animateTableUpdate(): void {
  // Re-trigger a brief, non-blocking transition after a tab, search, or selection changes the rows.
  el.tableBody.classList.remove('table-content-enter');
  void el.tableBody.offsetWidth;
  el.tableBody.classList.add('table-content-enter');
}

function ensureValidTab(): void {
  if (!state.activeFundTicker && state.selected.size) state.activeFundTicker = [...state.selected][0] || null;
  if (state.activeFundTicker && !state.selected.has(state.activeFundTicker)) state.activeFundTicker = [...state.selected][0] || null;

  const tabIds = getAllTabIds();
  if (!tabIds.includes(state.activeTab)) {
    state.activeTab = tabIds.includes('All') ? 'All' : (tabIds[0] || 'All');
    state.sortKey = 'rank';
    state.sortDir = 'asc';
  }
}

function getTabs(): Array<{ id: ActiveTab; label: string; count: number }> {
  const categories = uniqueCategories();
  const tabs: Array<{ id: ActiveTab; label: string; count: number }> = [];

  tabs.push({ id: 'All', label: 'All ETFs', count: state.funds.length });
  categories.forEach(category => {
    tabs.push({
      id: category,
      label: categoryLabel(category),
      count: state.funds.filter(fund => fund.category === category).length,
    });
  });

  return tabs;
}

function getSelectedTabs(): Array<{ id: ActiveTab; label: string; count: number }> {
  const tabs: Array<{ id: ActiveTab; label: string; count: number }> = [];
  const activeFund = getActiveFund();

  if (activeFund) {
    DETAIL_TABS.forEach(tab => {
      tabs.push({
        id: `detail:${tab.key}`,
        label: tab.key === 'overview' ? `${activeFund.ticker} ${tab.label}` : tab.label,
        count: getDetailCount(tab.key),
      });
    });
  }

  if (state.selected.size > 0) {
    tabs.push({ id: 'watchlist', label: 'Watchlist', count: getDedupedWatchlistRows().length });
  }

  return tabs;
}

function getAllTabIds(): ActiveTab[] {
  return [...getTabs(), ...getSelectedTabs()].map(tab => tab.id);
}

function uniqueCategories(): string[] {
  const preferred = ['Income', 'Thematic', 'Core'];
  const categories = [...new Set(state.funds.map(fund => fund.category).filter(Boolean))];
  return categories.sort((a, b) => {
    const ai = preferred.indexOf(a);
    const bi = preferred.indexOf(b);
    if (ai !== -1 || bi !== -1) return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    return categoryLabel(a).localeCompare(categoryLabel(b));
  });
}

function renderTabs(): void {
  renderTabButtons(el.tabsBar, getTabs());

  const selectedTabs = getSelectedTabs();
  // The panel above the table is reserved for detail and Watchlist tabs only.
  el.selectedTabsPanel.classList.toggle('is-visible', selectedTabs.length > 0);
  renderTabButtons(el.selectedTabsBar, selectedTabs);
}

function renderTabButtons(container: any, tabs: Array<{ id: ActiveTab; label: string; count: number }>): void {
  container.classList.toggle('hidden', tabs.length <= 1);
  const allSelected = state.funds.length > 0 && state.selected.size === state.funds.length;
  container.innerHTML = tabs.map(tab => {
    const isActive = tab.id === state.activeTab;
    const activeClasses = 'bg-blue-600 text-white font-medium border-blue-500 shadow-sm';
    const inactiveClasses = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700';
    if (tab.id === 'All') {
      return `
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition border whitespace-nowrap ${isActive ? activeClasses : inactiveClasses}">
          <input type="checkbox" id="select-all-toggle" ${allSelected ? 'checked' : ''} class="w-3.5 h-3.5 accent-blue-600 cursor-pointer" title="Select / Deselect all ETFs" />
          <button data-tab="All" class="font-medium hover:underline focus:outline-none">
            ${escapeHtml(tab.label)} (${tab.count})
          </button>
        </div>
      `;
    }
    return `
      <button
        data-tab="${escapeHtml(tab.id)}"
        class="px-3.5 py-1.5 rounded-full text-xs transition border whitespace-nowrap ${isActive ? activeClasses : inactiveClasses}">
        ${escapeHtml(tab.label)} (${tab.count})
      </button>
    `;
  }).join('');

  container.querySelectorAll('button[data-tab]').forEach((button: any) => {
    button.addEventListener('click', () => {
      state.activeTab = button.dataset.tab || 'All';
      applyDefaultSortForTab(state.activeTab);
      syncSearchInput();
      render();
    });
  });

  const selectAllToggle = container.querySelector('#select-all-toggle');
  if (selectAllToggle) {
    selectAllToggle.addEventListener('change', (event: any) => {
      event.stopPropagation();
      toggleSelectAll(Boolean(event.target.checked));
    });
    selectAllToggle.addEventListener('click', (event: any) => event.stopPropagation());
  }
}

    return;

  if (tab === 'overview') return renderOverviewTable(activeFund, detail);
  if (tab === 'holdings') return renderSelectedFundHoldings(activeFund);
  if (tab === 'performance') return renderPerformanceTable(activeFund, detail);
  if (tab === 'allocations') return renderAllocationsTable(activeFund, detail);
  if (tab === 'distributions') return renderDistributionsTable(activeFund, detail);
  if (tab === 'yields') return renderYieldsTable(activeFund, detail);
  renderPriceTable(activeFund, detail);
}

function searchScope(): string {
  if (state.activeTab === 'watchlist') return 'watchlist';
  if (isDetailTab(state.activeTab)) return `${state.activeFundTicker || 'ETF'}:${state.activeTab}`;
  return 'etfs';
}

function currentQuery(): string {
  return state.searches[searchScope()] || '';
}

function setCurrentQuery(value: string): void {
  const scope = searchScope();
  if (value) state.searches[scope] = value;
  else delete state.searches[scope];
  persistSearches();
}

function syncSearchInput(): void {
  const query = currentQuery();
  if (document.activeElement !== el.searchInput && el.searchInput.value !== query) {
    el.searchInput.value = query;
  }
  el.searchInput.placeholder = isEtfCatalogTab(state.activeTab)
    ? 'Search ETFs, fund names, holdings, tickers, CUSIPs...'
    : `Search ${tabLabel(state.activeTab)}...`;
}

function isEtfCatalogTab(tab: ActiveTab): boolean {
  return tab === 'All' || state.funds.some(fund => fund.category === tab);
}

function tabLabel(tab: ActiveTab): string {
  if (tab === 'watchlist') return 'Watchlist';
  if (isDetailTab(tab)) {
    const key = detailTabKey(tab);
    const found = DETAIL_TABS.find(item => item.key === key);
    return found ? found.label : 'ETF details';
  }
  return categoryLabel(tab);
}

function getVisibleFunds(): FundRow[] {
  const query = normalizeSearchText(currentQuery());
  return state.funds.filter(fund => {
    const tabMatch = state.activeTab === 'All' || state.activeTab === fund.category;
    const queryMatch = !query || fund.searchIndex.includes(query);
    return tabMatch && queryMatch;
  });
}

function getSelectedPositions(): Holding[] {
  return [...state.selected]
    .flatMap(ticker => state.holdings[ticker]?.positions || [])
    .map(position => ({
      ...position,
      fundTicker: sanitizeTicker(position.fundTicker),
      flags: position.flags?.length ? position.flags : ['symbol'],
    }));
}

function getVisibleWatchlistRows(): WatchlistRow[] {
  const query = normalizeSearchText(currentQuery());
  return getDedupedWatchlistRows().filter(row => !query || row.searchIndex.includes(query));
}

function getDedupedWatchlistRows(): WatchlistRow[] {
  const map: Map<string, {
    symbol: string;
    names: Set<string>;
    cusips: Set<string>;
    flags: Set<string>;
    funds: Set<string>;
    weightSum: number;
    maxWeight: number | null;
    marketValueSum: number;
  }> = new Map();

  for (const position of getSelectedPositions()) {
    const symbol = sanitizeWatchlistSymbol(position.symbol);
    if (!symbol || !passesWatchlistDefault(position)) continue;

    if (!map.has(symbol)) {
      map.set(symbol, {
        symbol,
        names: new Set(),
        cusips: new Set(),
        flags: new Set(),
        funds: new Set(),
        weightSum: 0,
        maxWeight: null,
        marketValueSum: 0,
      });
    }

    const row = map.get(symbol);
    if (!row) continue;
    row.names.add(position.name || symbol);
    if (position.cusip) row.cusips.add(position.cusip);
    (position.flags || []).forEach(flag => row.flags.add(flag));
    row.funds.add(position.fundTicker);

    if (Number.isFinite(position.weight)) {
      const weight = Number(position.weight);
      row.weightSum += weight;
      row.maxWeight = row.maxWeight === null ? weight : Math.max(row.maxWeight, weight);
    }
    if (Number.isFinite(position.marketValue)) row.marketValueSum += Number(position.marketValue);
  }

  return [...map.values()].map(row => {
    const names = [...row.names];
    const fundTickers = [...row.funds].sort();
    const flags = [...row.flags].sort();
    const cusips = [...row.cusips].sort();
    const name = names[0] || row.symbol;

    return {
      symbol: row.symbol,
      name,
      names,
      cusips,
      flags,
      fundTickers,
      fundCount: fundTickers.length,
      weightSum: row.weightSum,
      maxWeight: row.maxWeight,
      marketValueSum: row.marketValueSum,
      searchIndex: normalizeSearchText([row.symbol, name, names.join(' '), cusips.join(' '), flags.join(' '), fundTickers.join(' ')].join(' ')),
    };
  });
}

function getOverviewRows(fund: FundRow, detail: FundDetail): TableRow[] {
  const meta = detail.metadata || {};
  const daily = detail.daily || {};
  const yields = detail.yields || {};
  return [
    metricRow('Fund', 'Ticker', fund.ticker),
    metricRow('Fund', 'Name', fund.name),
    metricRow('Fund', 'Type', categoryLabel(fund.category)),
    metricRow('Fund', 'Fund Page', `https://amplifyetfs.com/${fund.ticker}/`),
    metricRow('Fund', 'Holdings Page', `https://amplifyetfs.com/${fund.ticker}-holdings/`),
    metricRow('Fund Details', 'Launch Date', meta.LaunchDate || meta.AmplifyStartDate),
    metricRow('Fund Details', 'Inception Date', meta.InceptionDate),
    metricRow('Fund Details', 'Primary Exchange', meta.PrimaryExchange),
    metricRow('Fund Details', 'CUSIP', meta.CUSIP || daily.CUSIP),
    metricRow('Fund Details', 'ISIN', meta.ISIN),
    metricRow('Fund Details', 'Asset Class Focus', meta.AssetClassFocus),
    metricRow('Fund Details', 'Actively Managed', booleanLabel(meta.isActivelyManaged)),
    metricRow('Price', 'NAV', fund.nav),
    metricRow('Price', 'Market Price', formatMaybeMoney(daily.MarketPrice, 2)),
    metricRow('Price', 'Net Assets', fund.netAssets),
    metricRow('Price', 'Shares Outstanding', formatInteger(daily.SharesOutstanding)),
    metricRow('Yield', 'Distribution Rate', yields.Distribution_Yield),
    metricRow('Yield', '30-Day SEC Yield', yields['30_Day_SECYield']),
    metricRow('Holdings', 'Holdings Count', formatInteger(fund.holdingsCount)),
    metricRow('Holdings', 'Holdings As Of', fund.holdingsAsOfDate),
  ].filter(row => row.value && row.value !== '—');
}

function metricRow(section: string, metric: string, value: unknown): TableRow {
  const text = value === undefined || value === null || value === '' ? '—' : String(value);
  return {
    section,
    metric,
    value: text,
    searchIndex: normalizeSearchText([section, metric, text].join(' ')),
  };
}

function getFundHoldingRows(ticker: string): TableRow[] {
  return (state.holdings[ticker]?.positions || []).map(position => ({
    ...position,
    weight: numberOrNull(position.weight),
    shares: numberOrNull(position.shares),
    marketValue: numberOrNull(position.marketValue),
    flags: position.flags?.length ? position.flags : ['symbol'],
    searchIndex: normalizeSearchText([position.symbol, position.name, position.cusip, position.flags?.join(' ')].join(' ')),
  }));
}

function getPerformanceRows(detail: FundDetail): TableRow[] {
  const docs: Array<{ period: string; doc?: PerformanceDoc | null }> = [
    { period: 'Month End', doc: detail.performance?.monthly },
    { period: 'Quarter End', doc: detail.performance?.quarterly },
  ];
  const rows: TableRow[] = [];

  docs.forEach(({ period, doc }) => {
    (doc?.returns || []).forEach(item => {
      const returns = item.returns || {};
      const row: TableRow = {
        period,
        asOfDate: doc?.asOfDate || '',
        type: item.type || '',
        ticker: item.ticker || '',
        label: item.label || item.ticker || '',
        searchIndex: normalizeSearchText([period, doc?.asOfDate, item.type, item.ticker, item.label].join(' ')),
      };
      Object.entries(returns).forEach(([key, value]) => { row[key] = numberOrNull(value) ?? value; });
      rows.push(row);
    });
  });

  return rows;
}

function getAllocationRows(detail: FundDetail): TableRow[] {
  const asOfDate = detail.allocations?.asOfDate || '';
  return (detail.allocations?.allocations || []).flatMap(allocation =>
    (allocation.dimvalues || []).map(value => ({
      dimension: cleanDimensionName(allocation.dimensionName || 'Allocation'),
      label: value.label || '',
      weight: numberOrNull(value.weight),
      holdingCount: numberOrNull(value.holdingCount),
      asOfDate,
      searchIndex: normalizeSearchText([allocation.dimensionName, value.label, asOfDate].join(' ')),
    }))
  );
}

function getDistributionRows(detail: FundDetail): TableRow[] {
  return (detail.distributions || []).map(distribution => ({
    ...distribution,
    amountSort: numberOrNull(distribution.amount) ?? -Infinity,
    searchIndex: normalizeSearchText([distribution.exDate, distribution.recordDate, distribution.payableDate, distribution.amount, distribution.type, distribution.note, distribution.year].join(' ')),
  }));
}

function getYieldRows(detail: FundDetail): TableRow[] {
  const y = detail.yields || {};
  const asOfDate = String(y.asOfDate || '');
  return [
    metricRow('Yields', 'Distribution Rate', y.Distribution_Yield),
    metricRow('Yields', '30-Day SEC Yield', y['30_Day_SECYield']),
    metricRow('Yields', '30-Day Unsubsidized SEC Yield', y['30_Day_UnsubSECYield']),
    metricRow('Yields', 'CUSIP', y.CUSIP),
    metricRow('Yields', 'Updated At', y.UpdatedAt),

function getPriceRows(detail: FundDetail): TableRow[] {
  const d = detail.daily || {};
  const asOfDate = String(d.asOfDate || '');
  return [
    metricRow('Price', 'Net Asset Value', formatMaybeMoney(d.NAV, 2)),
    metricRow('Price', 'NAV Daily Change', formatMaybeMoney(d.NAVChangeDollars, 2)),
    metricRow('Price', 'NAV % Daily Change', formatPercent(d.NAVChangePercentage)),
    metricRow('Price', 'Market Price', formatMaybeMoney(d.MarketPrice, 2)),
    metricRow('Price', 'Market Price Daily Change', formatMaybeMoney(d.MarketPriceChangeDollars, 2)),
    metricRow('Price', 'Market Price % Daily Change', formatPercent(d.MarketPriceChangePercentage)),
    metricRow('Premium / Discount', 'Premium / Discount', formatPercent(d.PremiumDiscount)),
    metricRow('Trading', '30-Day Median Bid/Ask Spread', formatPercent(d.Median30DaySpread)),
    metricRow('Fund', 'Net Assets', formatMaybeMoney(d.NetAssets, 0)),
    metricRow('Fund', 'Shares Outstanding', formatInteger(d.SharesOutstanding)),
    metricRow('Fund', 'CUSIP', d.CUSIP),

function filterRows(rows: any[]): any[] {
  const query = normalizeSearchText(currentQuery());
  return rows.filter(row => !query || normalizeSearchText(row.searchIndex || Object.values(row).join(' ')).includes(query));
}

function getCurrentVisibleRows(): any[] {
  if (state.activeTab === 'watchlist') return getVisibleWatchlistRows();
  if (!isDetailTab(state.activeTab)) return getVisibleFunds();
  const fund = getActiveFund();
  const detail = getActiveDetail();
  if (!fund || !detail) return [];
  const tab = detailTabKey(state.activeTab);
  if (tab === 'overview') return filterRows(getOverviewRows(fund, detail));
  if (tab === 'holdings') return filterRows(getFundHoldingRows(fund.ticker));
  if (tab === 'performance') return filterRows(getPerformanceRows(detail));
  if (tab === 'allocations') return filterRows(getAllocationRows(detail));
  if (tab === 'distributions') return filterRows(getDistributionRows(detail));
  if (tab === 'yields') return filterRows(getYieldRows(detail));
  return filterRows(getPriceRows(detail));
}

function getDetailCount(tab: FundDetailTab): number {
  const fund = getActiveFund();
  const detail = getActiveDetail();
  if (!fund || !detail) return 0;
  if (tab === 'overview') return getOverviewRows(fund, detail).length;
  if (tab === 'holdings') return state.holdings[fund.ticker]?.positions?.length || 0;
  if (tab === 'performance') return getPerformanceRows(detail).length;
  if (tab === 'allocations') return getAllocationRows(detail).length;
  if (tab === 'distributions') return detail.distributions?.length || 0;
  if (tab === 'yields') return getYieldRows(detail).length;
  return getPriceRows(detail).length;
}

function passesWatchlistDefault(position: Holding): boolean {
  const symbol = sanitizeWatchlistSymbol(position.symbol);
  const flags = new Set(position.flags || []);
  if (!symbol) return false;
  if (['cash', 'money-market', 'treasury', 'option', 'derivative', 'cusip-like'].some(flag => flags.has(flag))) return false;
  return /[A-Z]/.test(symbol);
}

function bindSelectAllCheckbox(): void {
  const checkbox = el.tableHead.querySelector('#select-all-checkbox');
  if (!checkbox) return;
  checkbox.addEventListener('change', (event: any) => {
    event.stopPropagation();
    toggleSelectAll(Boolean(event.target.checked));
  });
  checkbox.addEventListener('click', (event: any) => event.stopPropagation());
}

function toggleSelectAll(selectAll: boolean): void {
  if (selectAll) {
    state.selected = new Set(state.funds.map(fund => fund.ticker));
    if (!state.activeFundTicker) state.activeFundTicker = state.funds[0] ? state.funds[0].ticker : null;
  } else {
    state.selected.clear();
    state.activeFundTicker = null;
    if (state.activeTab === 'watchlist' || isDetailTab(state.activeTab)) {
      state.activeTab = 'All';
      state.sortKey = 'rank';
      state.sortDir = 'asc';
    }
  }
  persistSelection();
  render();
}

function toggleFund(ticker: string): void {
  const cleanTicker = sanitizeTicker(ticker);
  if (!cleanTicker) return;

  if (state.selected.has(cleanTicker)) {
    state.selected.delete(cleanTicker);
    if (state.activeFundTicker === cleanTicker) state.activeFundTicker = [...state.selected][0] || null;
  } else {
    state.selected.add(cleanTicker);
    state.activeFundTicker = cleanTicker;
  }

  persistSelection();
  render();
}

function clearSelectionAndSearch(): void {
  state.selected.clear();
  state.activeFundTicker = null;
  state.searches = {};
  state.activeTab = 'All';
  state.sortKey = 'rank';
  state.sortDir = 'asc';
  el.searchInput.value = '';
  localStorage.removeItem(SELECTED_KEY);
  localStorage.removeItem(ACTIVE_FUND_KEY);
  localStorage.removeItem(SEARCHES_KEY);
  render();
}

function copyTickers(): void {
  const tickers = getVisibleWatchlistRows().map(row => row.symbol).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!tickers.length) return;
  void copyText(tickers.join(', ')).then(() => {
    const oldText = el.copyBtn.textContent;
    el.copyBtn.textContent = 'Copied!';
    setTimeout(() => { el.copyBtn.textContent = oldText || 'Copy Tickers'; }, 1000);
  });
}

function exportCsv(): void {
  if (state.activeTab === 'watchlist') {
    const headers = ['Ticker', 'Name', '# ETFs', 'ETFs', 'Weight Sum (%)', 'Max Weight (%)', 'Market Value ($)', 'Flags'];
    const rows = getVisibleWatchlistRows().map(row => [
      row.symbol,
      row.name,
      String(row.fundCount),
      row.fundTickers.join('|'),
      numberCell(row.weightSum),
      numberCell(row.maxWeight),
      numberCell(row.marketValueSum),
      row.flags.join('|'),
    ]);
    downloadText(toCsv([headers, ...rows]), exportFileName('watchlist', 'csv'), 'text/csv;charset=utf-8;');
    return;
  }

  if (isDetailTab(state.activeTab)) {
    const tab = detailTabKey(state.activeTab);
    const rows = getCurrentVisibleRows();
    const headers = Object.keys(rows[0] || {}).filter(key => key !== 'searchIndex');
    downloadText(toCsv([headers, ...rows.map(row => headers.map(header => cellToString(row[header])))]), exportFileName(`${getActiveFund()?.ticker || 'ETF'}_${tab}`, 'csv'), 'text/csv;charset=utf-8;');
    return;
  }

  const headers = ['Selected', 'Ticker', 'Fund Name', 'Type', 'NAV', 'Net Assets', 'Expense Ratio', 'Dividend Yield', 'SEC Yield', 'YTD Return', 'TR 1Y', 'TR 3Y', 'TR 5Y', 'TR 10Y', 'CAGR 3Y', 'CAGR 5Y', 'CAGR 10Y', 'SI Ann.', 'Return As Of', 'Inception', 'Holdings', 'History', 'Holdings As Of'];
  const rows = getVisibleFunds().map(fund => [
    state.selected.has(fund.ticker) ? 'yes' : 'no',
    fund.ticker,
    fund.name,
    categoryLabel(fund.category),
    fund.nav || '',
    fund.netAssets || '',
    fund.expenseRatio || '',
    fund.distributionYield || '',
    fund.secYield || '',
    numberCell(fund.ytdReturn),
    numberCell(fund.tr1y),
    numberCell(fund.tr3y),
    numberCell(fund.tr5y),
    numberCell(fund.tr10y),
    numberCell(fund.cagr3y),
    numberCell(fund.cagr5y),
    numberCell(fund.cagr10y),
    numberCell(fund.siAnn),
    fund.returnAsOf || '',
    fund.inceptionDate || '',
    numberCell(fund.holdingsCount),
    numberCell(fund.historyCount),
    fund.holdingsAsOfDate || '',
  ]);
  downloadText(toCsv([headers, ...rows]), exportFileName('etfs', 'csv'), 'text/csv;charset=utf-8;');
}

function exportTxt(): void {
  let values: string[];
  if (state.activeTab === 'watchlist') {
    values = getVisibleWatchlistRows().map(row => row.symbol).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  } else if (isDetailTab(state.activeTab)) {
    values = getCurrentVisibleRows().map(row => Object.entries(row)
      .filter(([key]) => key !== 'searchIndex')
      .map(([key, value]) => `${key}: ${cellToString(value)}`)
      .join(' | '));
  } else {
    values = getVisibleFunds().map(fund => fund.ticker);
  }
  downloadText(values.join('\n'), exportFileName(state.activeTab === 'watchlist' ? 'watchlist' : isDetailTab(state.activeTab) ? detailTabKey(state.activeTab) : 'etfs', 'txt'), 'text/plain;charset=utf-8;');
}

function sortHeader(label: string, key: string, numeric = false): string {
  const active = state.sortKey === key;
  const arrow = active ? (state.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  const align = numeric ? ' text-right' : '';
  const tooltip = getHeaderTooltip(label);
  return `<th class="py-3.5 px-4${align}" title="${escapeHtml(tooltip)}"><button data-sort="${escapeHtml(key)}" title="${escapeHtml(tooltip)}" class="uppercase tracking-wider hover:text-blue-600 dark:hover:text-blue-400">${escapeHtml(label)}${arrow}</button></th>`;
}

function bindSortHeaders(): void {
  el.tableHead.querySelectorAll('button[data-sort]').forEach((button: any) => {
    button.addEventListener('click', () => {
      const key = button.dataset.sort || 'rank';
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else {
        state.sortKey = key;
        state.sortDir = ['ticker', 'name', 'category', 'symbol', 'section', 'metric', 'period', 'label', 'exDate'].includes(key) ? 'asc' : 'desc';
      }
      render();
    });
  });
}

function sortRows(rows: any[]): any[] {
  const direction = state.sortDir === 'asc' ? 1 : -1;
  const key = state.sortKey;
  return [...rows].sort((a, b) => compareValues(sortValue(a, key), sortValue(b, key)) * direction);
}

function sortValue(row: Record<string, unknown>, key: string): unknown {
  if (key === 'flags') return Array.isArray(row.flags) ? row.flags.join(',') : '';
  return row[key];
}

function compareValues(a: unknown, b: unknown): number {
  if (typeof a === 'number' || typeof b === 'number') {
    const an = typeof a === 'number' && Number.isFinite(a) ? a : -Infinity;
    const bn = typeof b === 'number' && Number.isFinite(b) ? b : -Infinity;
    return an === bn ? 0 : an > bn ? 1 : -1;
  }
  return String(a ?? '').localeCompare(String(b ?? ''), undefined, { numeric: true, sensitivity: 'base' });
}

function restoreSelectedEtfs(): void {
  try {
    const saved = JSON.parse(localStorage.getItem(SELECTED_KEY) || '[]');
    state.selected = new Set(saved.map(sanitizeTicker).filter(Boolean));
    if (!state.selected.size && localStorage.getItem(SELECTED_KEY) === null) state.selected = new Set(DEFAULT_SELECTED_TICKERS);
  } catch {
    state.selected = new Set(DEFAULT_SELECTED_TICKERS);
  }
  const savedActive = sanitizeTicker(localStorage.getItem(ACTIVE_FUND_KEY) || '');
  state.activeFundTicker = savedActive && state.selected.has(savedActive) ? savedActive : ([...state.selected][0] || null);
}

function persistSelection(): void {
  localStorage.setItem(SELECTED_KEY, JSON.stringify([...state.selected]));
  if (state.activeFundTicker) localStorage.setItem(ACTIVE_FUND_KEY, state.activeFundTicker);
  else localStorage.removeItem(ACTIVE_FUND_KEY);
}


function restoreSearches(): void {
  try {
    const saved = JSON.parse(localStorage.getItem(SEARCHES_KEY) || '{}');
    state.searches = saved && typeof saved === 'object' ? saved : {};
  } catch {
    state.searches = {};
  }
}

function persistSearches(): void {
  localStorage.setItem(SEARCHES_KEY, JSON.stringify(state.searches));
}

function applyTheme(dark: boolean): void {
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc';
  el.themeToggle.textContent = dark ? '☀️' : '🌙';
  el.themeToggle.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
}

function setStatus(message: string, tone: 'info' | 'success' | 'error'): void {
  console.debug(`[${tone}] ${message}`);
}

function setDetailStatus(fund: FundRow, message: string): void {
  setStatus(`${fund.ticker} — ${fund.name}. ${message}. ETF page: https://amplifyetfs.com/${fund.ticker}/`, 'success');
}

function getActiveFund(): FundRow | null {
  return state.activeFundTicker ? state.funds.find(fund => fund.ticker === state.activeFundTicker) || null : null;
}

function getActiveDetail(): FundDetail | null {
  return state.activeFundTicker ? state.details[state.activeFundTicker] || null : null;
}

function isDetailTab(tab: ActiveTab | string): boolean {
  return tab.startsWith('detail:');
}

function detailTabKey(tab: ActiveTab | string): any {
  const key = tab.replace('detail:', '') || 'overview';
  return DETAIL_TABS.some(item => item.key === key) ? key : 'overview';
}

function applyDefaultSortForTab(tab: ActiveTab): void {
  if (tab === 'watchlist') {
    state.sortKey = 'weightSum';
    state.sortDir = 'desc';
  } else if (isDetailTab(tab)) {
    const key = detailTabKey(tab);
    const defaults: any = {
      overview: ['section', 'asc'],
      holdings: ['weight', 'desc'],
      performance: ['period', 'asc'],
      allocations: ['weight', 'desc'],
      distributions: ['exDate', 'desc'],
      yields: ['metric', 'asc'],
      price: ['metric', 'asc'],
    };
    [state.sortKey, state.sortDir] = defaults[key] || defaults.overview;
  } else {
    state.sortKey = 'rank';
    state.sortDir = 'asc';
  }
}

function categoryLabel(category: string): string {
  return category === 'Thematic' ? 'Growth' : category || 'Other';
}

function normalizeCategory(category?: string): string {
  return (category || 'Other').trim() || 'Other';
}

function cleanDimensionName(value: string): string {
  return value.replace(/^HoldingClassification\s*-\s*/i, '').replace(/GICS\s+/i, '').trim() || 'Allocation';
}

function booleanLabel(value: unknown): string {
  if (value === true) return 'Yes';
  if (value === false) return 'No';
  return '—';
}

function returnLabel(key: string): string {
  const labels: any = { SI_Cum: 'SI Cum.', SI_Ann: 'SI Ann.' };
  return labels[key] || key;
}

function sanitizeTicker(value: unknown): string {
  return String(value || '').trim().toUpperCase().replace(/[^A-Z0-9._-]/g, '');
}

function sanitizeWatchlistSymbol(value: unknown): string {
  return String(value || '').trim().toUpperCase();
}

function normalizeSearchText(value: unknown): string {
  return String(value || '').toLowerCase().replace(/\s+/g, ' ').trim();
}


function stringArray(value: unknown): string[] {
  return Array.isArray(value) ? value.map(item => String(item)) : [];
}

function numberOrNull(value: unknown): number | null {
  if (value === null || value === undefined || value === '') return null;
  const parsed = typeof value === 'number' ? value : Number(String(value).replace(/[$,%]/g, '').replace(/,/g, ''));
  return Number.isFinite(parsed) ? parsed : null;
}

function numberCell(value: unknown): string | number {
  const parsed = numberOrNull(value);
  return parsed === null ? '' : parsed;
}

function formatInteger(value: unknown): string {
  const parsed = numberOrNull(value);
  return parsed === null ? '—' : parsed.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function formatNumber(value: unknown): string {
  const parsed = numberOrNull(value);
  return parsed === null ? '—' : parsed.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function formatPercent(value: unknown): string {
  const parsed = numberOrNull(value);
  return parsed === null ? '—' : `${parsed.toFixed(2)}%`;
}

function formatAllocationPercent(value: unknown): string {
  const parsed = numberOrNull(value);
  if (parsed === null) return '—';
  const pct = Math.abs(parsed) <= 1 ? parsed * 100 : parsed;
  return `${pct.toFixed(2)}%`;
}

function formatMoney(value: unknown): string {
  const parsed = numberOrNull(value);
  if (parsed === null) return '—';
  return parsed.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0, minimumFractionDigits: 0 });
}

function formatMaybeMoney(value: unknown, decimals: number): string {
  const parsed = numberOrNull(value);
  if (parsed === null) return '—';
  return parsed.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: decimals, minimumFractionDigits: decimals });
}

function formatDistributionAmount(value: unknown): string {
  const parsed = numberOrNull(value);
  if (parsed === null) return '—';
  return parsed.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 6, minimumFractionDigits: 2 });
}

function renderFlags(flags: string[]): string {
  return `<div class="flex flex-wrap gap-1 max-w-sm">${flags.map(flag => {
    const tone = flag === 'symbol' || flag === 'exchange-suffix'
      ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-300 border-emerald-100 dark:border-emerald-800'
      : 'bg-amber-50 dark:bg-amber-900/20 text-amber-700 dark:text-amber-300 border-amber-100 dark:border-amber-800';
    return `<span class="text-xs border rounded-full px-2 py-0.5 ${tone}">${escapeHtml(flag)}</span>`;
  }).join('')}</div>`;
}

function toCsv(rows: Array<Array<string | number>>): string {
  return rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
}

function csvEscape(value: string | number): string {
  const s = String(value ?? '');
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function cellToString(value: unknown): string {
  if (Array.isArray(value)) return value.join('|');
  if (value && typeof value === 'object') return JSON.stringify(value);
  return String(value ?? '');
}

function exportFileName(kind: string, extension: 'csv' | 'txt'): string {
  const suffix = currentQuery() ? '_filtered' : '';
  return `Amplify_${kind}_${new Date().toISOString().slice(0, 10)}${suffix}.${extension}`;
}

function downloadText(text: string, filename: string, mimeType: string): void {
  const blob = new Blob([text], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 250);
}

async function copyText(text: string): Promise<void> {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand('copy');
  textarea.remove();
}

function escapeHtml(value: unknown): string {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;',
  }[char] || char));
}

function byId(id: string): any {
  const element = document.getElementById(id);
  if (!element) throw new Error(`Missing element #${id}`);
  return element;
}
